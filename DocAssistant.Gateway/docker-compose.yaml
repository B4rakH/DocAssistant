services:
  postgres-server:
    image: postgres:16
    container_name: postgres-doc-assistant-gateway
    restart: always
    
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      
    ports:
      - "5432:5432"
      
    volumes:
      - doc-assistant-gateway-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: minio-doc-assistant
    restart: always
    
    command: server /data --console-address ":9001"
    
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    
    ports:
      - "9000:9000"  # API port
      - "9001:9001"  # Console UI port
    
    volumes:
      - minio-data:/data
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  doc-assistant-gateway-data:
    driver: local
  minio-data:
    driver: local